# .github/workflows/deploy-flow.yml
name: DeployFlow – Login → Build & Push

on:
  push:
    branches: [ main ]

jobs:
  # -------------------------------------------------
  # 1️⃣ Job: Docker Hub login & verification
  # -------------------------------------------------
  docker-login:
    runs-on: ubuntu-latest
    outputs:
      # This output is just a flag – it will be “true” if the login succeeded.
      login-ok: ${{ steps.verify.outputs.success }}
    steps:
      - name: Checkout (required for the login‑action to work)
        uses: actions/checkout@v4

      - name: Docker login
        id: login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Verify login succeeded
        id: verify
        run: |
          # The login‑action writes `~/.docker/config.json`.
          # If the file exists and contains the auth entry, we consider it a success.
          if [ -f "${HOME}/.docker/config.json" ]; then
            echo "Docker login succeeded"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "Docker login failed"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # -------------------------------------------------
  # 2️⃣ Job: Build the image and push it
  # -------------------------------------------------
  build-and-push:
    needs: docker-login                # wait for the login job
    if: ${{ needs.docker-login.outputs.login-ok == 'true' }}
    runs-on: ubuntu-latest

    env:
      # Same image name used in the Dockerfile example
      DOCKER_IMAGE: pradeepmk799/deployflow

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Re‑login – each job gets a fresh runner, so we need the credentials again
      - name: Docker login (again)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE