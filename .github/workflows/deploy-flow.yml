# .github/workflows/deploy-flow.yml
name: DeployFlow CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest          # Linux is required for the docker/login-action
    env:
      DOCKER_IMAGE: pradeepmk17/deployflow   # <namespace>/<repo>
      CONTAINER_NAME: deployflow-app
      APP_PORT: 8000

    steps:
      # -------------------------------------------------
      # 1️⃣ Checkout source
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # 2️⃣ Docker Hub login – **uses the secrets**
      # -------------------------------------------------
      - name: Docker login
        uses: docker/login-action@v3
        with:
          logout: true                # removes credentials after the job finishes
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # -------------------------------------------------
      # 3️⃣ Build the Docker image
      # -------------------------------------------------
      - name: Build Docker image
        run: |
          docker build -t ${{ env.DOCKER_IMAGE }} .

      # -------------------------------------------------
      # 4️⃣ Push the image to Docker Hub
      # -------------------------------------------------
      - name: Push image
        run: |
          docker push ${{ env.DOCKER_IMAGE }}

      # -------------------------------------------------
      # 5️⃣ (Optional) Deploy to EC2 – uses your existing SSH secrets
      # -------------------------------------------------
      - name: Deploy container on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_IP }}
          EC2_USER: ${{ secrets.EC2_SSH_USERNAME }}
          EC2_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          # Write the PEM key to a temporary file
          echo "${EC2_KEY}" > ec2_key.pem
          chmod 600 ec2_key.pem

          # Pull the freshly‑pushed image on the remote host
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} \
            "docker pull ${{ env.DOCKER_IMAGE }}"

          # Restart the container (force‑recreate)
          ssh -i ec2_key.pem -o StrictHostKeyChecking=no ${EC2_USER}@${EC2_HOST} \
            "docker rm -f ${CONTAINER_NAME} || true && \
             docker run -d --name ${CONTAINER_NAME} -p ${APP_PORT}:${APP_PORT} ${{ env.DOCKER_IMAGE }}"

          # Clean up the temporary PEM file
          rm -f ec2_key.pem