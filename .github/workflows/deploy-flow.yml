name: DeployFlow CI/CD

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      DOCKER_IMAGE: pradeepmk17/deployflow:latest
      CONTAINER_NAME: deployflow-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker Hub secrets
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "Username length: ${#DOCKER_HUB_USERNAME}"
          echo "Token length: ${#DOCKER_HUB_TOKEN}"

      - name: Docker login
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "$DOCKER_HUB_TOKEN" | docker login \
            -u "$DOCKER_HUB_USERNAME" \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST_IP }}
          EC2_USER: ${{ secrets.EC2_SSH_USERNAME }}
          EC2_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          echo "$EC2_KEY" > ec2_key.pem
          chmod 600 ec2_key.pem

          ssh -i ec2_key.pem -o StrictHostKeyChecking=no \
            ${EC2_USER}@${EC2_HOST} \
            "docker pull $DOCKER_IMAGE"

          ssh -i ec2_key.pem -o StrictHostKeyChecking=no \
            ${EC2_USER}@${EC2_HOST} \
            "docker rm -f ${CONTAINER_NAME} || true
             docker run -d \
               --name ${CONTAINER_NAME} \
               -p 80:80 \
               -p 8000:8000 \
               ${DOCKER_IMAGE}"

          rm -f ec2_key.pem