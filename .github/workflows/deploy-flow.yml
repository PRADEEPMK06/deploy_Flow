name: DeployFlow – CLI Login → Build & Push

on:
  push:
    branches: [ main ]

jobs:
  # -------------------------------------------------
  # Job 1 – pure Docker CLI login (and verification)
  # -------------------------------------------------
  docker-login:
    runs-on: ubuntu-latest
    outputs:
      login-ok: ${{ steps.verify.outputs.success }}
    steps:
      - uses: actions/checkout@v4

      - name: Docker login via CLI
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

      - name: Verify login succeeded
        id: verify
        run: |
          if [ -f "${HOME}/.docker/config.json" ]; then
            echo "Docker login succeeded"
            echo "success=true" >> $GITHUB_OUTPUT
          else
            echo "Docker login failed"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  # -------------------------------------------------
  # Job 2 – build the image and push it
  # -------------------------------------------------
  build-and-push:
    needs: docker-login
    if: ${{ needs.docker-login.outputs.login-ok == 'true' }}
    runs-on: ubuntu-latest
    env:
      DOCKER_IMAGE: pradeepmk799/deployflow   # change if you want a different repo/tag
    steps:
      - uses: actions/checkout@v4

      # Re‑login because each job gets a fresh VM
      - name: Docker login again (CLI)
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: |
          echo "$DOCKER_HUB_TOKEN" | docker login -u "$DOCKER_HUB_USERNAME" --password-stdin

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE .

      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE