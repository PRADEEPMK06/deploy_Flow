name: DeployFlow CI/CD Pipeline (Docker Hub & AWS EC2)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  DOCKER_IMAGE: pradeepmk799/deployflow
  CONTAINER_NAME: deployflow-app
  APP_PORT: 8000

jobs:
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-to-ec2:
    name: 🚀 Deploy Container on AWS EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: 🌐 Execute Remote SSH Deployment on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          passphrase: ${{ secrets.EC2_PASSPHRASE || '' }}
          script_stop: true
          script: |
            echo "========================================================"
            echo "🐳 Pulling latest Docker image: ${{ env.DOCKER_IMAGE }}:latest..."
            echo "========================================================"
            sudo docker pull ${{ env.DOCKER_IMAGE }}:latest

            echo "🛑 Stopping and removing previous container if running..."
            sudo docker stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            sudo docker rm ${{ env.CONTAINER_NAME }} 2>/dev/null || true

            echo "⚡ Launching updated container on port ${{ env.APP_PORT }}..."
            sudo docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              -p ${{ env.APP_PORT }}:${{ env.APP_PORT }} \
              -e PORT=${{ env.APP_PORT }} \
              -e NODE_ENV=production \
              -e EC2_HOST_IP="${{ secrets.EC2_HOST }}" \
              -v /var/run/docker.sock:/var/run/docker.sock \
              --restart unless-stopped \
              ${{ env.DOCKER_IMAGE }}:latest

            echo "🧹 Cleaning up dangling Docker images..."
            sudo docker image prune -f || true

            echo "🔍 Verifying running container..."
            sudo docker ps --filter "name=${{ env.CONTAINER_NAME }}"

            echo "========================================================"
            echo "🎉 Deployment successful!"
            echo "👉 Live URL: http://${{ secrets.EC2_HOST }}:${{ env.APP_PORT }}"
            echo "========================================================"
