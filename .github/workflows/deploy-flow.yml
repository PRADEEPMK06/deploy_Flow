# .github/workflows/deploy-flow.yml
name: DeployFlow CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest          # Docker actions need a Linux runner
    env:
      DOCKER_IMAGE: pradeepmk799/deployflow   # <your repo>/<image name>
      CONTAINER_NAME: deployflow-app
      APP_PORT: 8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -------------------------------------------------
      # Docker Hub login – **uses the secrets you just created**
      # -------------------------------------------------
      - name: Docker login
        uses: docker/login-action@v3
        with:
          logout: true                # cleans up after the job
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE }} .

      - name: Push image to Docker Hub
        run: docker push ${{ env.DOCKER_IMAGE }}

      # (Add your SSH‑deploy step here – see the snippet in §4)