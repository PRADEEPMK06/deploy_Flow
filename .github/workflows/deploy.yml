name: Deploy to EC2

on:
  push:
    branches: [ main ]

jobs:
  deploy-master:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/DeployFlow

            # 1. Pull the absolute latest code safely (overwrites any local drift)
            git fetch origin main
            git reset --hard origin/main

            # 2. Stop the running container gracefully
            sudo docker-compose down

            # 3. Build using Docker cache (fast & space-efficient, only rebuilds what changed)
            sudo docker-compose build

            # 4. Start the new container
            sudo docker-compose up -d

            # 5. Clean up ONLY old, unused dangling Docker images to keep disk clean
            sudo docker image prune -f