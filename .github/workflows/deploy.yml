name: DeployFlow CI/CD to AWS EC2

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Provision EC2 Instance on Push
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
        run: |
          python -c "
          import boto3, os, time
          region = os.getenv('AWS_DEFAULT_REGION', 'us-east-1')
          ec2 = boto3.client('ec2', region_name=region)
          ssm = boto3.client('ssm', region_name=region)
          
          print('Fetching latest Amazon Linux 2023 AMI ID dynamically...')
          # Dynamically fetch the official AMI ID for this specific region
          ami_param = ssm.get_parameter(Name='/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64')
          ami_id = ami_param['Parameter']['Value']
          print(f'Using AMI ID: {ami_id}')
          
          print('Launching EC2 instance...')
          res = ec2.run_instances(
              ImageId=ami_id,
              InstanceType='t2.micro',
              MinCount=1,
              MaxCount=1,
              TagSpecifications=[{'ResourceType': 'instance', 'Tags': [{'Key': 'Name', 'Value': 'deployflow-github-push'}]}]
          )
          instance_id = res['Instances'][0]['InstanceId']
          print(f'Instance ID: {instance_id}. Waiting for public IP...')
          
          public_ip = ''
          for _ in range(30):
              time.sleep(5)
              desc = ec2.describe_instances(InstanceIds=[instance_id])
              inst = desc['Reservations'][0]['Instances'][0]
              if inst['State']['Name'] == 'running':
                  public_ip = inst.get('PublicIpAddress', '')
                  if public_ip:
                      break
          
          print('----------------------------------------')
          if public_ip:
              print(f'LIVE DEPLOYMENT URL: http://{public_ip}')
          else:
              print('Instance is running, but public IP allocation took a moment. Check your AWS EC2 Console.')
          print('----------------------------------------')
          "