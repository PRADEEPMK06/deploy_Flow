name: DeployFlow CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies (including flake8)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8
      - name: Lint (flake8)
        run: flake8 . --ignore=E501,W292,F401,E302,E261,W293
      - name: Run tests (if any)
        run: pytest || echo "No tests"

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  deploy-to-aws:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PRIMARY_EC2_IP }} >> ~/.ssh/known_hosts
      - name: Copy backend files
        run: |
          scp -r backend/ ${{ secrets.PRIMARY_EC2_USER }}@${{ secrets.PRIMARY_EC2_IP }}:/home/ubuntu/deployflow_backend
      - name: Copy frontend build
        run: |
          scp -r frontend/dist/ ${{ secrets.PRIMARY_EC2_USER }}@${{ secrets.PRIMARY_EC2_IP }}:/home/ubuntu/deployflow_frontend
      - name: SSH and restart services
        run: |
          ssh ${{ secrets.PRIMARY_EC2_USER }}@${{ secrets.PRIMARY_EC2_IP }} << 'EOS'
            cd /home/ubuntu/deployflow_backend
            python -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            sudo systemctl restart deployflow-backend || true
            nohup uvicorn main:app --host 0.0.0.0 --port 8000 &
            cd /home/ubuntu/deployflow_frontend
            nohup npx serve -s . -l 3000 &
          EOS
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}