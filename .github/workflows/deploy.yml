name: DeployFlow CI/CD to AWS EC2

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Deploy and Refresh EC2 Instance
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-east-1' }}
          CUSTOM_AMI_ID: 'ami-0866a3c8686eaeebb'
        run: |
          python -c "
          import boto3, os, time
          region = os.getenv('AWS_DEFAULT_REGION', 'us-east-1')
          ami_id = os.getenv('CUSTOM_AMI_ID')
          ec2 = boto3.client('ec2', region_name=region)
          tag_name = 'deployflow-github-push'
          
          print('Cleaning up old instances...')
          response = ec2.describe_instances(
              Filters=[
                  {'Name': 'tag:Name', 'Values': [tag_name]},
                  {'Name': 'instance-state-name', 'Values': ['pending', 'running', 'stopped']}
              ]
          )
          instance_ids_to_terminate = [inst['InstanceId'] for res in response['Reservations'] for inst in res['Instances']]
          if instance_ids_to_terminate:
              ec2.terminate_instances(InstanceIds=instance_ids_to_terminate)
              time.sleep(15)

          user_data_script = '''#!/bin/bash
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y python3-pip
          pip3 install fastapi uvicorn
          echo 'from fastapi import FastAPI; app = FastAPI(); @app.get(\"/\")\ndef read_root(): return {\"status\": \"DeployFlow is live on standard Ubuntu!\"}' > /home/ubuntu/app.py
          cd /home/ubuntu
          nohup uvicorn app:app --host 0.0.0.0 --port 80 &
          '''

          print(f'Launching standard x86_64 EC2 instance (t3.micro) with AMI: {ami_id}...')
          res = ec2.run_instances(
              ImageId=ami_id,
              InstanceType='t3.micro',
              MinCount=1,
              MaxCount=1,
              UserData=user_data_script,
              TagSpecifications=[{'ResourceType': 'instance', 'Tags': [{'Key': 'Name', 'Value': tag_name}]}]
          )
          instance_id = res['Instances'][0]['InstanceId']
          print(f'Instance ID: {instance_id}. Waiting for public IP...')
          
          public_ip = ''
          for _ in range(30):
              time.sleep(5)
              desc = ec2.describe_instances(InstanceIds=[instance_id])
              inst = desc['Reservations'][0]['Instances'][0]
              if inst['State']['Name'] == 'running':
                  public_ip = inst.get('PublicIpAddress', '')
                  if public_ip:
                      break
          
          print('----------------------------------------')
          if public_ip:
              print(f'LIVE DEPLOYMENT URL: http://{public_ip}')
          else:
              print('Instance is running, but public IP allocation took a moment.')
          print('----------------------------------------')
          "