name: DeployFlow CI/CD to AWS EC2

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3

      - name: Provision EC2 Instance on Push
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_AMI_ID: ${{ secrets.AWS_AMI_ID || 'ami-022e1a32d3f7426f1' }}
        run: |
          python -c "
          import boto3, os, time
          ec2 = boto3.client('ec2', region_name=os.getenv('AWS_DEFAULT_REGION', 'us-east-1'))
          print('Launching EC2 instance...')
          res = ec2.run_instances(
              ImageId=os.getenv('AWS_AMI_ID'),
              InstanceType='t2.micro',
              MinCount=1,
              MaxCount=1,
              TagSpecifications=[{'ResourceType': 'instance', 'Tags': [{'Key': 'Name', 'Value': 'deployflow-github-push'}]}]
          )
          instance_id = res['Instances'][0]['InstanceId']
          print(f'Instance ID: {instance_id}. Waiting for public IP...')
          
          # Wait for running state and public IP
          public_ip = ''
          for _ in range(30):
              time.sleep(5)
              desc = ec2.describe_instances(InstanceIds=[instance_id])
              inst = desc['Reservations'][0]['Instances'][0]
              if inst['State']['Name'] == 'running':
                  public_ip = inst.get('PublicIpAddress', '')
                  if public_ip:
                      break
          
          print('----------------------------------------')
          if public_ip:
              print(f'LIVE DEPLOYMENT URL: http://{public_ip}')
          else:
              print('Instance is running, but public IP allocation took too long. Check AWS Console.')
          print('----------------------------------------')
          "