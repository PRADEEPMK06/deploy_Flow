name: CI/CD Pipeline to EC2

on:
  push:
    branches: [ main ]

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Validate Syntax
        run: |
          python -m compileall .
          echo "Validation passed successfully."

  build:
    name: Build Application
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build Check
        run: |
          echo "Build artifacts verification passed."

  test:
    name: Run Tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f backend/requirements.txt ]; then pip install -r backend/requirements.txt; fi

      - name: Run Tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -d "tests" ] || [ -d "backend/tests" ]; then
            pytest;
          else
            echo "No test directory found, skipping tests.";
          fi

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/DeployFlow

            # 1. Pull the absolute latest code safely
            git fetch origin main
            git reset --hard origin/main

            # 2. Inject Supabase DATABASE_URL into a .env file on EC2
            echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env

            # 3. Stop the running container gracefully
            sudo docker-compose down

            # 4. Build using Docker cache
            sudo docker-compose build

            # 5. Start the new container
            sudo docker-compose up -d

            # 6. Clean up old dangling Docker images
            sudo docker image prune -f