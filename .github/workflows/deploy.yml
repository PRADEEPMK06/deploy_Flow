name: DeployFlow CI/CD to EC2

on:
  push:
    branches: [ "main", "master" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Deploy to EC2 via SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Step 1: Connecting to EC2 server and checking previous deployment..."
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            
            # Check if project directory exists, create if missing
            if [ ! -d "~/DeployFlow" ]; then
              echo "Project directory not found. Creating ~/DeployFlow..."
              mkdir -p ~/DeployFlow
            fi

            cd ~/DeployFlow

            echo "Step 2: Checking prerequisites (Docker & Docker Compose)..."
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo apt-get update
              sudo apt-get install -y apt-transport-https ca-certificates curl software-properties-common
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo apt-key add -
              sudo add-apt-repository "deb [arch=amd64] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable"
              sudo apt-get update
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io
              sudo usermod -aG docker $USER
            else
              echo "Docker is already installed."
            fi

            if ! command -v docker-compose &> /dev/null && ! docker compose version &> /dev/null; then
              echo "Docker Compose not found. Installing Docker Compose..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.20.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
            else
              echo "Docker Compose is already installed."
            fi

            echo "Step 3: Cleaning up old containers/images..."
            if [ -f "docker-compose.yml" ]; then
              sudo docker-compose down --rmi local || true
            fi

          EOF

      - name: Copy Project Files to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "~/DeployFlow"

      - name: Build, Make Live, and Verify EC2 Condition
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no $EC2_USER@$EC2_HOST << 'EOF'
            cd ~/DeployFlow

            echo "Step 4: Building and launching the application..."
            sudo docker-compose up --build -d

            echo "Step 5: Verifying container running conditions..."
            sleep 5
            sudo docker ps

            # Health check on localhost inside EC2
            if curl -s http://localhost:8000 > /dev/null || curl -s http://localhost:80 > /dev/null; then
              echo "Application is up and responding locally!"
            else
              echo "Warning: Local health check didn't return immediately, check docker logs."
              sudo docker-compose logs --tail=50
            fi

            echo "=========================================="
            echo "DEPLOYMENT COMPLETE & EC2 IS LIVE!"
            echo "Access your DeployFlow application at:"
            echo "http://$EC2_HOST"
            echo "=========================================="
          EOF