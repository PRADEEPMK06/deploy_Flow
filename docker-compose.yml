version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: deployflow-backend
    restart: always
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/deployflow
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: deployflow-db
    restart: always
    environment:
    # --- Sensitive Data Restriction Note: Credentials below are standard local/development defaults ---
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: deployflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: