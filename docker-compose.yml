version: '3.8'

services:
  deployflow-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: deployflow_master
    restart: always
    ports:
      - "80:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - user_deployments:/app/deployments # Persistent storage for cloned user repos
    environment:
      - BASE_DOMAIN=44.220.156.159 # Or your domain name if you have one

volumes:
  user_deployments: